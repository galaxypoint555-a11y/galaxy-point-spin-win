/* Video-reference redesign: photographic editorial storefront and motion. */
.nav{background:#33231e;color:#fff;border-color:#33231e;min-height:68px;justify-content:space-between}
.nav .logo,.nav button,.nav .navlinks button{color:#fff}.nav .logo{position:absolute;left:50%;transform:translateX(-50%);font-family:Georgia,serif;font-weight:500;letter-spacing:2.5px;font-size:19px;white-space:nowrap}.nav .logo b{font-family:Arial,sans-serif;color:#e4ccab;letter-spacing:3px}
.navlinks{margin-left:auto;margin-right:56px}.nav .bag{color:#fff}.nav .bag span{background:#b68a65}.menu-pop{background:#e9ded3}.menu-pop button{background:transparent;font-family:Georgia,serif;font-size:23px;border-bottom:1px solid #d8cabe}
.topline{background:#241914;color:#e6d8c7}.notice{background:#f4eadd;color:#775d47}
.hero{position:relative;display:block;height:min(84svh,850px);min-height:550px;background:#30211b;overflow:hidden}
.hero-images,.hero-shade{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1.1s ease,transform 7s ease}
.hero-slide.active{opacity:1;transform:scale(1)}
.hero-slide img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
.hero-shade{background:linear-gradient(180deg,#1d100e66 0%,transparent 35%,#1d100edc 100%);z-index:1}
.hero-caption{position:absolute;z-index:2;bottom:65px;left:4%;right:4%;color:#fff;text-align:center;animation:hero-in 1s ease both}
.hero-caption .overline{font-size:11px;color:#f4dec5;letter-spacing:2.6px}
.hero-caption h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,66px);line-height:1.09;font-weight:400;letter-spacing:0;margin:15px 0}
.hero-caption p{font-size:12px;letter-spacing:.03em;color:#efdfd5}
.hero-caption .outline-btn{margin-top:12px;font-size:10px;letter-spacing:2px}
.hero-dots{display:flex;gap:7px;justify-content:center;margin-top:29px}
.hero-dots span{width:6px;height:6px;border-radius:50%;background:#ffffff77;transition:width .3s,background .3s}.hero-dots span.active{width:22px;border-radius:10px;background:white}
.scroll-label{position:absolute;right:18px;bottom:25px;color:#fff9;font-size:9px;letter-spacing:2px;z-index:3}
@keyframes hero-in{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}
.round-rail{display:flex;gap:23px;overflow-x:auto;padding:20px 0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}.round-rail::-webkit-scrollbar,.collection-rail::-webkit-scrollbar,.feature-rail::-webkit-scrollbar{display:none}
.round-item{flex:0 0 calc((100% - 92px)/5);scroll-snap-align:start;cursor:pointer;text-align:center;font-size:13px;font-family:Georgia,serif}
.round-image{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#ece5df;margin-bottom:14px;transition:transform .4s}
.round-image:hover{transform:scale(1.055)}.round-image img{width:100%;height:100%;object-fit:cover}
.gp-round-section{padding:52px 6% 43px}.gp-round-section h2,.intro h2,.feature-copy h2{font-family:Georgia,serif;font-weight:400}
.gp-round-section p{font-size:12px}.tiny-dots{color:#746052;font-size:11px;margin-top:9px;letter-spacing:8px}
.marquee{overflow:hidden;background:#e9dcd0;border-block:1px solid #e1cfc0;padding:15px 0}.marquee-track{display:flex;width:max-content;animation:marquee 26s linear infinite}.marquee-track span{white-space:nowrap;font-size:11px;letter-spacing:2px;color:#6a4a3a;padding-right:38px}@keyframes marquee{to{transform:translateX(-50%)}}
.section-products{padding-top:68px}.product-grid{margin-top:32px}.prod-img{height:auto;aspect-ratio:0.78;background:#ede7e0}
.prod-img img,.real-photo{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease,filter .4s}
.product:hover .prod-img img{transform:scale(1.065)}
.product{border:none}.prod-info{padding:11px 3px 16px;text-align:left}.prod-info h3{font-weight:400;font-size:16px}.prod-info .price{font-weight:600;font-size:14px}.brand{color:#938477}.tag{z-index:2;background:#fffdf9;color:#65503e;font-size:9px}.heart{z-index:2;background:#ffffffcf;border-radius:50%;width:31px;height:31px;display:grid;place-items:center}.add{background:#37251e;transition:background .2s,transform .2s}.add:active{transform:scale(.97)}
.outlined-dark{color:#3a291f;background:transparent;border:1px solid #9f8675;border-radius:3px;padding:14px 25px;font-size:11px;letter-spacing:1px;font-weight:650;margin:24px auto 0;display:inline-block}
.feature-split{display:grid;grid-template-columns:1fr 1fr;background:#f1e8dd;min-height:450px}.feature-photo{min-height:450px;overflow:hidden}.feature-photo img,.story-photograph img{height:100%;width:100%;object-fit:cover;transition:transform .8s}.feature-split:hover img{transform:scale(1.03)}
.feature-copy{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:50px 10%}.feature-copy h2{font-size:clamp(35px,4vw,54px);margin:18px 0 10px}.feature-copy p{line-height:1.8;color:#827569;font-size:13px;max-width:340px}
.collection-section{background:#fffaf7}.collection-rail{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.collection-card{cursor:pointer;position:relative;aspect-ratio:.9;overflow:hidden;border-radius:9px;background:#e7e1db}.collection-card img{height:100%;width:100%;object-fit:cover;transition:transform .6s}.collection-card:hover img{transform:scale(1.06)}.collection-label{position:absolute;bottom:0;left:0;right:0;text-align:left;background:linear-gradient(transparent,#24140ecb);padding:48px 17px 18px;color:white;font:25px Georgia,serif}.collection-label span{display:block;font:9px Arial,sans-serif;letter-spacing:1.3px;margin-top:10px}
.feature-rail{display:flex;overflow-x:auto;gap:15px;scroll-snap-type:x mandatory;margin-top:32px;scrollbar-width:none}.rail-card{flex:0 0 25%;text-align:left;scroll-snap-align:center}.rail-photo{aspect-ratio:.8;background:#f2ebe4;overflow:hidden}.rail-photo img{width:100%;height:100%;object-fit:cover}.rail-card h3{font:16px Georgia,serif;margin:14px 0 7px}.rail-card div:not(.rail-photo){font-size:12px}.rail-card button{border:0;background:none;padding:12px 0;font-size:10px;letter-spacing:1px;text-decoration:underline}
.story-art.story-photograph{background:#d9cdc0}.story-photograph img{display:block;min-height:350px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease;transition-delay:var(--delay,0ms)}.reveal.in-view{opacity:1;transform:translateY(0)}
@media(max-width:750px){
.nav{min-height:68px;padding:12px 18px}.nav .logo{font-size:16px}.nav .logo b{font-size:7px}
.menu-pop{top:68px}.menu-pop button{font-size:23px}
.hero{height:calc(100svh - 120px);min-height:570px;max-height:800px;display:block}
.hero-caption{bottom:37px;left:15px;right:15px}.hero-caption h1{font-size:31px}.hero-caption p{font-size:11px}.scroll-label{display:none}
.gp-round-section{padding:38px 15px 25px}.round-rail{gap:16px;margin:0 -15px;padding:15px 15px}.round-item{flex:0 0 42%;font-size:13px}
.section-products{padding-top:45px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prod-img{height:auto;aspect-ratio:.73}.prod-info h3{font-size:14px}.prod-info .price{font-size:13px}.prod-info{padding:10px 2px 12px}
.feature-split{grid-template-columns:1fr}.feature-photo{min-height:330px;max-height:450px}.feature-copy{padding:33px 22px 46px}.feature-copy h2{font-size:33px}
.collection-rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-right:-4vw;padding-right:4vw}.collection-card{flex:0 0 70%;aspect-ratio:.82;scroll-snap-align:center}
.rail-card{flex:0 0 48%}.round-item .round-image{width:100%}
}
@media(prefers-reduced-motion:reduce){.hero-slide,.reveal,.marquee-track{transition:none!important;animation:none!important}.reveal{opacity:1!important;transform:none!important}}

/* Genuine Galaxy Point promotional device pictures, displayed only with matching model labels */
.photo-tile{display:block;position:relative;width:100%;height:100%;background-image:var(--gp-photos);background-size:300% 200%;background-repeat:no-repeat;background-color:#e7ddd3}
.photo-1{background-position:0% 0%}
.photo-2{background-position:50% 0%}
.photo-3{background-position:100% 0%}
.photo-4{background-position:0% 100%}
.photo-5{background-position:50% 100%}
.photo-6{background-position:100% 100%}
.prod-img .photo-tile{transition:transform .55s ease}
.product:hover .prod-img .photo-tile{transform:scale(1.05)}
.round-image .photo-tile,.collection-card .photo-tile,.rail-photo .photo-tile{width:100%;height:100%}
.hero-video-layer,.hero-video-layer .photo-tile,.hero-video-layer video{position:absolute;inset:0;width:100%;height:100%}
.hero-video-layer .photo-tile{background-position:100% 0%;animation:shopZoom 16s alternate infinite ease-in-out}
.hero-video-layer video{display:none;object-fit:cover;z-index:2}
.hero.video-ready .hero-video-layer video{display:block}
.hero-caption{z-index:5}
.hero-shade{z-index:4;pointer-events:none}
.shop-video-note{position:absolute;z-index:7;left:12px;top:13px;color:#f7e4d2;border:1px solid #fff5;padding:7px 12px;background:#0004;font-size:9px;letter-spacing:1.2px}
@keyframes shopZoom{from{transform:scale(1)}to{transform:scale(1.2)}}
.feature-photo .photo-tile{width:100%;height:100%;min-height:390px}

function photo(p,extra=""){const i=typeof p==="object"?p.id:Number(p)||1;return '<div role="img" aria-label="Galaxy Point promotional photo of '+(typeof p==="object"?p.name:"phone")+'" class="photo-tile photo-'+Math.max(1,Math.min(6,i))+' '+extra+'"></div>';}
function cards(){const arr=items.filter(p=>cat==="All"||p.category===cat);return '<div class="product-grid">'+arr.map((p,i)=>'<article class="product reveal" style="--delay:'+Math.min(i%4*70,210)+'ms"><div class="prod-img"><span class="tag">PREMIUM PICK</span><button class="heart" title="Add to wishlist" data-like="'+p.id+'">♡</button>'+photo(p)+'</div><div class="prod-info"><div class="brand">'+p.brand+'</div><h3>'+p.name+'</h3><div class="variant">'+p.details+'</div><div class="price">'+money(p.price)+'</div><button class="add" data-add="'+p.id+'" '+(p.stock?'':'disabled')+'>'+(p.stock?'ADD TO BAG +':'SOLD OUT')+'</button></div></article>').join("")+'</div>'}
function catalog(){return '<section class="section intro" id="catalog"><div class="eyebrow">THE COLLECTION</div><h2>New & Trending</h2><p>Find your next upgrade at Galaxy Point, Kharghar.</p><div class="chips">'+["All","iPhone","Samsung","Laptops"].map(c=>'<button class="'+(cat===c?"on":"")+'" data-cat="'+c+'">'+c+'</button>').join("")+'</div>'+cards()+'</section>'}
function footer(){return '<footer class="footer"><h2>GALAXY POINT</h2><p>Shop No. 49, Tiara Mall, Sector 13, Kharghar, Navi Mumbai<br>Buy • Sell • Exchange • Repairs • EMI Enquiry</p><p>Instagram: @galaxy_pointt26</p><div class="fine">© GALAXY POINT • Concept preview • Prices and stock illustrative</div></footer>'}
function home(){return '<section class="hero"><div class="hero-video-layer">'+photo(3)+'<video id="gpStoreVideo" autoplay muted loop playsinline webkit-playsinline preload="metadata"><source src="galaxy-point-shop-video.mp4" type="video/mp4"></video></div><div class="hero-shade"></div><div class="shop-video-note">GALAXY POINT • KHARGHAR</div><div class="hero-caption"><div class="overline">WELCOME TO OUR STORE</div><h1>Discover your<br>next upgrade.</h1><p>Premium mobile phones, laptops and trusted service.</p><button class="outline-btn" data-page="shop">EXPLORE COLLECTION →</button></div></section>'+
'<section class="section intro gp-round-section reveal"><div class="eyebrow">EXPLORE THE COLLECTION</div><h2>Shop by Category</h2><p>Every product photo is paired with the correct device model.</p><div class="round-rail">'+[["iPhone",2],["Samsung",4],["Laptops",5]].map(x=>'<div class="round-item" data-cat="'+x[0]+'"><div class="round-image">'+photo(x[1])+'</div><span>'+x[0]+'</span></div>').join('')+'</div></section>'+
'<div class="marquee"><div class="marquee-track"><span>GALAXY POINT ✦ BUY ✦ SELL ✦ EXCHANGE ✦ REPAIRS ✦ KHARGHAR ✦</span><span>GALAXY POINT ✦ BUY ✦ SELL ✦ EXCHANGE ✦ REPAIRS ✦ KHARGHAR ✦</span></div></div>'+
'<section class="section intro section-products reveal"><div class="eyebrow">OUR MOBILE COLLECTION</div><h2>Browse our devices</h2><p>Product photos from Galaxy Point promotional creatives. Verify availability before ordering.</p><div class="chips">'+["All","iPhone","Samsung","Laptops"].map(c=>'<button class="'+(cat===c?"on":"")+'" data-cat="'+c+'">'+c+'</button>').join("")+'</div>'+cards()+'</section>'+
'<section class="feature-split reveal"><div class="feature-photo">'+photo(2)+'</div><div class="feature-copy"><span class="eyebrow">IPHONE COLLECTION</span><h2>Upgrade to Pro.</h2><p>Find your next iPhone at Galaxy Point Kharghar. Buy, sell and exchange with our in-store team.</p><button class="outlined-dark" data-cat="iPhone">EXPLORE IPHONES</button></div></section>'+
'<section class="section intro collection-section reveal"><span class="eyebrow">EXPLORE THE COLLECTIONS</span><h2>Handpicked for you</h2><div class="collection-rail">'+[["iPhone Pro Max",2,"iPhone"],["Samsung Fold",3,"Samsung"],["MacBook Neo",5,"Laptops"]].map(x=>'<div class="collection-card" data-cat="'+x[2]+'">'+photo(x[1])+'<div class="collection-label">'+x[0]+' <span>SHOP NOW →</span></div></div>').join('')+'</div></section>'+
'<section class="section intro reveal"><div class="eyebrow">CUSTOMER FAVOURITES</div><h2>Featured Devices</h2><div class="feature-rail">'+items.map(p=>'<div class="rail-card"><div class="rail-photo">'+photo(p)+'</div><h3>'+p.name+'</h3><div>'+money(p.price)+'</div><button data-add="'+p.id+'">ADD TO BAG +</button></div>').join('')+'</div></section>'+
'<section class="story reveal"><div class="story-art story-photograph">'+photo(6)+'</div><div class="story-copy"><div class="eyebrow">TRUSTED IN KHARGHAR</div><h2>More Than Just a Mobile Store.</h2><p>Buy, sell, exchange and repair your devices with Galaxy Point. Visit our Kharghar store for the latest offers and exact stock availability.</p><button data-page="shop">EXPLORE COLLECTION</button></div></section>'+
'<section class="section intro reveal" style="background:#f6f0e9"><span class="eyebrow">VISIT OUR STORE</span><h2>Customers come for the deal,<br>stay for the trust.</h2><p>Shop No. 49, Tiara Mall, Sector 13, Kharghar, Navi Mumbai</p></section>'}
function shop(){return '<section class="section intro"><div class="eyebrow">GALAXY POINT STORE</div><h2>Shop Our Collection</h2><p>iPhone, Samsung, Android & more.</p></section>'+catalog()}
function cart(){const arr=items.filter(x=>bag[x.id]);return '<div class="page"><div class="eyebrow">YOUR SELECTION</div><h1>Shopping Bag</h1>'+(arr.length?arr.map(p=>'<div class="line"><div><strong>'+p.name+'</strong><small>'+p.details+' • '+money(p.price)+'</small></div><div class="quantity"><button data-dec="'+p.id+'">−</button><span>'+bag[p.id]+'</span><button data-add="'+p.id+'">+</button></div></div>').join("")+'<div class="total"><span>Subtotal</span><span>'+money(sum())+'</span></div><div class="callout">Preview only — checkout does not place a real Galaxy Point order.</div><button class="primary" data-page="checkout">CONTINUE TO CHECKOUT →</button>':'<div class="empty">Your shopping bag is empty.<p><button class="primary" data-page="shop">SHOP NOW</button></p></div>')+'</div>'}
function checkout(){if(!count())return cart();return '<div class="page"><div class="eyebrow">SECURE CHECKOUT PREVIEW</div><h1>Checkout</h1><div class="callout">Demo checkout. No real payment, shipping request, or order will be submitted.</div><form class="form" id="checkoutForm"><label>Full name<input name="name" maxlength="70" required placeholder="Your full name"></label><label>Mobile number<input name="mobile" type="tel" maxlength="10" pattern="[0-9]{10}" required placeholder="10-digit mobile number"></label><label>Receive order<select name="method"><option>Store Pickup — Kharghar</option><option>Delivery Enquiry</option></select></label><label>Demo payment method<select><option>Pay at store — demo only</option></select></label><div class="total"><span>Total</span><span>'+money(sum())+'</span></div><button class="primary" type="submit">CREATE DEMO ORDER</button></form></div>'}
function track(){return '<div class="page"><div class="eyebrow">YOUR ORDERS</div><h1>Track Order</h1><p style="color:#817366;font-size:13px">Enter the demo order ID shown after checkout.</p><form class="form" id="trackForm"><label>Order ID<input name="id" required placeholder="GP-DEMO-1234"></label><button class="primary">TRACK DEMO ORDER</button></form><div id="trackResult"></div></div>'}
function admin(){return '<div class="page"><div class="eyebrow">GALAXY POINT</div><h1>Admin Dashboard Preview</h1><div class="callout">Public demo only. No real admin access or cloud inventory is exposed here.</div><div class="categories" style="grid-template-columns:repeat(2,1fr)"><div class="category" style="min-height:120px"><h2>'+items.length+'</h2>Demo Products</div><div class="category" style="min-height:120px"><h2>'+orders.length+'</h2>Demo Orders</div></div><h2 style="font:26px Georgia;margin-top:40px">Inventory Preview</h2>'+items.map(p=>'<div class="line"><div><strong>'+p.name+'</strong><small>'+money(p.price)+' • Stock '+p.stock+'</small></div><div class="quantity"><button data-stock="-'+p.id+'">−</button><button data-stock="+'+p.id+'">+</button></div></div>').join("")+'<h2 style="font:26px Georgia;margin-top:40px">Test Orders</h2>'+(orders.length?orders.map(o=>'<div class="line"><div><strong>'+o.id+'</strong><small>'+money(o.total)+' • '+o.name+'</small></div><span class="badgelike">Pending</span></div>').join(""):'<p>No demo orders yet.</p>')+'</div>'}
function count(){return Object.values(bag).reduce((a,b)=>a+b,0)}function sum(){return items.reduce((t,p)=>t+Number(p.price||0)*(bag[p.id]||0),0)||null}
function show(){document.getElementById("bagCount").textContent=count();v.innerHTML=(page==="home"?home():page==="shop"?shop():page==="cart"?cart():page==="checkout"?checkout():page==="track"?track():admin())+footer();document.getElementById("menuPop").classList.remove("visible");window.scrollTo({top:0,behavior:"instant"});setupReveals();setupStoreVideo()}
function setupReveals(){const nodes=[...document.querySelectorAll(".reveal")];if(!("IntersectionObserver" in window)){nodes.forEach(n=>n.classList.add("in-view"));return}const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add("in-view");observer.unobserve(entry.target)}})},{threshold:.06,rootMargin:"0px 0px 25px 0px"});nodes.forEach(n=>observer.observe(n))}

function setupStoreVideo(){const v=document.getElementById("gpStoreVideo");if(!v)return;let hero=v.closest(".hero");v.addEventListener("playing",()=>hero.classList.add("video-ready"),{once:true});v.addEventListener("error",()=>hero.classList.remove("video-ready"),{once:true});const go=v.play();if(go&&typeof go.catch==="function")go.catch(()=>{});}
setInterval(()=>{const slides=[...document.querySelectorAll(".hero-slide")],dots=[...document.querySelectorAll(".hero-dots span")];if(slides.length<2)return;const active=slides.findIndex(s=>s.classList.contains("active"));slides.forEach((s,i)=>s.classList.toggle("active",i===(active+1)%slides.length));dots.forEach((s,i)=>s.classList.toggle("active",i===(active+1)%dots.length))},4700);

document.addEventListener("click",function(e){const t=e.target.closest("[data-page],[data-cat],[data-add],[data-dec],[data-like],[data-stock]");if(!t)return;const d=t.dataset;if(d.page){page=d.page;show()}else if(d.cat){cat=d.cat;page="shop";show()}else if(d.add){const p=items.find(x=>x.id===+d.add);if(p&&(bag[p.id]||0)<p.stock){bag[p.id]=(bag[p.id]||0)+1;show()}}else if(d.dec){bag[d.dec]=(bag[d.dec]||0)-1;if(bag[d.dec]<=0)delete bag[d.dec];show()}else if(d.like){t.textContent=t.textContent==="♥"?"♡":"♥";t.style.color="#b94f52"}else if(d.stock){let p=items.find(x=>x.id===+d.stock.slice(1));if(p){p.stock=Math.max(0,p.stock+(d.stock[0]==="+"?1:-1));show()}}});
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("menuPop").classList.toggle("visible"));
document.getElementById("chatBtn").addEventListener("click",()=>alert("Galaxy Point Kharghar — Visit Shop No. 49, Tiara Mall, Sector 13. This is a demo; WhatsApp is not configured yet."));
document.addEventListener("submit",function(e){if(e.target.id==="checkoutForm"){e.preventDefault();const f=new FormData(e.target);const id="GP-DEMO-"+Math.floor(1000+Math.random()*9000);orders.push({id,name:String(f.get("name")).slice(0,70),total:sum()});bag={};page="track";show();document.getElementById("trackResult").innerHTML='<div class="callout"><strong>Demo order created:</strong> '+id+'<br>No real order was submitted. Enter the ID above to try order tracking.</div>'}else if(e.target.id==="trackForm"){e.preventDefault();const f=new FormData(e.target),id=String(f.get("id")).trim().toUpperCase(),o=orders.find(x=>x.id===id);document.getElementById("trackResult").innerHTML=o?'<div class="callout"><strong>'+o.id+'</strong><br>Status: Demo Pending<br>Amount: '+money(o.total)+'</div>':'<div class="callout">No matching demo order in this browser session.</div>'}});
show();
})();
</script></body></html>
