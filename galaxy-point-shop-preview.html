ius:19px;border:5px solid #575651;background:linear-gradient(145deg,#898c8a,#515e59);width:82px;height:143px;transform:rotate(-9deg);box-shadow:13px 16px 20px #0003}.device:before{content:"";position:absolute;left:8px;top:7px;width:32px;height:40px;border-radius:10px;background:radial-gradient(circle at 10px 10px,#15231f 0 7px,transparent 8px),radial-gradient(circle at 22px 27px,#15231f 0 7px,transparent 8px),#84938c}.device.blue{background:linear-gradient(135deg,#577584,#172f46)}.device.black{background:linear-gradient(135deg,#72777a,#25292b)}.device.gold{background:linear-gradient(135deg,#cbb89e,#866f5a)}.device.fold{width:128px;background:linear-gradient(140deg,#293e47 0 49%,#18242b 50%);border-radius:10px;transform:rotate(-6deg)}.device.fold:before{display:none}.device.laptop{width:165px;height:105px;transform:rotate(0);border-radius:8px;background:linear-gradient(135deg,#132a35,#90afb2 50%,#173b48);border-color:#adb4b2}.device.laptop:before{content:"";display:block;position:absolute;left:-18px;right:-18px;top:100%;width:auto;height:8px;background:#aaaead;border-radius:0 0 60% 60%}.device.watch{width:90px;height:98px;border-radius:25px;transform:rotate(0);background:#121719;border-color:#888}.device.watch:before{display:none}.small .device{transform:scale(.8) rotate(-8deg)}.small .device.laptop,.small .device.watch{transform:scale(.85)}.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:25px}.product{position:relative;border:1px solid #eee7e0;background:#fff}.prod-img{height:240px;background:#f4efe9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.prod-img .device{transform:scale(1.13) rotate(-9deg)}.prod-img .device.fold{transform:scale(1.13) rotate(-5deg)}.prod-img .device.laptop,.prod-img .device.watch{transform:scale(1.1)}.tag{position:absolute;top:12px;left:12px;background:#fff;padding:7px 9px;font-size:9px;letter-spacing:1px;z-index:1}.heart{position:absolute;top:6px;right:7p margin-top:7px;border:1px solid #d9cbbd;padding:13px;font-size:14px;border-radius:0;background:#fff}.callout{padding:15px;background:#fff3df;color:#755537;border:1px solid #f0dcc0;font-size:12px;line-height:1.8;margin:15px 0}.empty{text-align:center;padding:60px 10px;color:#897970}.badgelike{background:#dfede6;color:#24614a;padding:6px 10px;font-size:11px}.chat{position:fixed;bottom:22px;right:22px;border-radius:50%;width:55px;height:55px;background:#2f7650;color:#fff;border:3px solid #fff;box-shadow:0 6px 25px #0004;font-size:22px;z-index:21}.menu-pop{display:none;position:sticky;top:61px;background:white;z-index:19;box-shadow:0 12px 22px #0002}.menu-pop button{display:block;border:0;background:#fff;text-align:left;padding:13px 7%;width:100%}

</style></head><body><div class="topline">GALAXY POINT KHARGHAR • PREMIUM DEVICES • TRUSTED DEALS</div><div class="notice">WEBSITE PREVIEW ONLY — Sample products & prices. No real orders or payments.</div>
<header class="nav"><button class="mobile-menu" id="menuBtn" aria-label="Menu">☰</button><div class="logo" data-page="home">GALAXY POINT<b>KHARGHAR</b></div><div class="navlinks"><button data-page="home">HOME</button><button data-page="shop">SHOP ALL</button><button data-cat="iPhone">IPHONE</button><button data-cat="Samsung">SAMSUNG</button><button data-page="track">TRACK ORDER</button><button data-page="admin">ADMIN DEMO</button></div><button class="bag" data-page="cart" aria-label="View shopping bag">♧ <span id="bagCount">0</span></button></header><nav class="menu-pop" id="menuPop"><button data-page="home">Home</button><button data-page="shop">Shop All</button><button data-cat="iPhone">iPhone Collection</button><button data-cat="Samsung">Samsung Collection</button><button data-cat="Laptops">Laptops</button><button data-page="track">Track Order</button><button data-page="admin">Admin Demo</button></nav>
<main id="view"></main><button class="chat" id="chatBtn" aria-label="Store contact">☏</button>
<script>
(function(){
const items=[
{id:1,name:"iPhone 17 Pro Max",brand:"APPLE",details:"256GB • Premium pre-owned",price:109999,category:"iPhone",art:"gold",stock:3},
{id:2,name:"Samsung Galaxy Z Fold7",brand:"SAMSUNG",details:"Foldable • Premium collection",price:92000,category:"Samsung",art:"fold",stock:2},
{id:3,name:"iPhone 16 Pro Max",brand:"APPLE",details:"256GB • Premium pre-owned",price:79999,category:"iPhone",art:"blue",stock:2},
{id:4,name:"Samsung S25 Ultra",brand:"SAMSUNG",details:"12GB / 512GB",price:85000,category:"Samsung",art:"black",stock:1},
{id:5,name:"Google Pixel 9 Pro XL",brand:"GOOGLE",details:"16GB / 128GB",price:59500,category:"Android",art:"blue",stock:2},
{id:6,name:"MacBook Neo",brand:"APPLE",details:"8GB / 256GB",price:65000,category:"Laptops",art:"laptop",stock:1},
{id:7,name:"iPhone 15 Pro",brand:"APPLE",details:"128GB • Premium pre-owned",price:44500,category:"iPhone",art:"black",stock:2},
{id:8,name:"Apple Watch Ultra",brand:"APPLE",details:"Smartwatch • Premium collection",price:19000,category:"Accessories",art:"watch",stock:2}
];let page="home",cat="All",bag={},orders=[];const v=document.getElementById("view"),money=n=>"₹"+n.toLocaleString("en-IN");
function art(a){return '<div class="device '+a+'"></div>'}
function cards(){const arr=items.filter(p=>cat==="All"||p.category===cat);return '<div class="product-grid">'+arr.map(p=>'<article class="product"><div class="prod-img"><span class="tag">PREMIUM DEAL</span><button class="heart" title="Wishlist" data-like="'+p.id+'">♡</button>'+art(p.art)+'</div><div class="prod-info"><div class="brand">'+p.brand+'</div><h3>'+p.name+'</h3><div class="variant">'+p.details+'</div><div class="price">'+money(p.price)+'</div><button class="add" data-add="'+p.id+'" '+(p.stock?'':'disabled')+'>'+(p.stock?'ADD TO BAG +':'SOLD OUT')+'</button></div></article>').join("")+'</div>'}
function catalog(){return '<section class="section intro" id="catalog"><div class="eyebrow">THE COLLECTION</div><h2>New & Trending</h2><p>Find your next upgrade at Galaxy Point, Kharghar.</p><div class="chips">'+["All","iPhone","Samsung","Android","Laptops","Accessories"].map(c=>'<button class="'+(cat===c?"on":"")+'" data-cat="'+c+'">'+c+'</button>').join("")+'</div>'+cards()+'</section>'}
function footer(){return '<footer class="footer"><h2>GALAXY POINT</h2><p>Shop No. 49, Tiara Mall, Sector 13, Kharghar, Navi Mumbai<br>Buy • Sell • Exchange • Repairs • EMI Enquiry</p><p>Instagram: @galaxy_pointt26</p><div class="fine">© GALAXY POINT • Concept preview • Prices and stock illustrative</div></footer>'}
function home(){return '<section class="hero"><div class="hero-copy"><div class="overline">THE GALAXY POINT COLLECTION</div><h1>Find Your<br>Perfect <i>Upgrade.</i></h1><p>From iconic iPhones to powerful Galaxy devices. Discover premium technology, memorable deals, and local support.</p><button class="outline-btn" data-page="shop">BROWSE OUR PRODUCTS →</button></div><div class="hero-art"><div class="hero-ring"></div><div class="phone back"><div class="camera"><i></i><i></i><i></i></div></div><div class="phone front"><div class="island"></div></div></div></section><section class="section intro"><div class="eyebrow">SHOP BY COLLECTION</div><h2>Explore Your Galaxy</h2><p>Handpicked devices for every style and budget.</p><div class="categories">'+[["iPhone","gold"],["Samsung","fold"],["Laptops","laptop"],["Accessories","watch"]].map(x=>'<div class="category" data-cat="'+x[0]+'"><div class="item-art small">'+art(x[1])+'</div><h3>'+x[0]+'</h3><span>DISCOVER MORE →</span></div>').join("")+'</div></section>'+catalog()+'<section class="story"><div class="story-art"><div class="phone back"><div class="camera"><i></i><i></i><i></i></div></div></div><div class="story-copy"><div class="eyebrow">TRUSTED IN KHARGHAR</div><h2>More Than Just a Mobile Store.</h2><p>Buy, sell, exchange and repair your devices with Galaxy Point. Visit our Kharghar store and explore a wide range of mobile phones, tablets and laptops.</p><button data-page="shop">EXPLORE THE COLLECTION</button></div></section>'}
function shop(){return '<section class="section intro"><div class="eyebrow">GALAXY POINT STORE</div><h2>Shop Our Collection</h2><p>iPhone, Samsung, Android & more.</p></section>'+catalog()}
function cart(){const arr=items.filter(x=>bag[x.id]);return '<div class="page"><div class="eyebrow">YOUR SELECTION</div><h1>Shopping Bag</h1>'+(arr.length?arr.map(p=>'<div class="line"><div><strong>'+p.name+'</strong><small>'+p.details+' • '+money(p.price)+'</small></div><div class="quantity"><button data-dec="'+p.id+'">−</button><span>'+bag[p.id]+'</span><button data-add="'+p.id+'">+</button></div></div>').join("")+'<div class="total"><span>Subtotal</span><span>'+money(sum())+'</span></div><div class="callout">Preview only — checkout does not place a real Galaxy Point order.</div><button class="primary" data-page="checkout">CONTINUE TO CHECKOUT →</button>':'<div class="empty">Your shopping bag is empty.<p><button class="primary" data-page="shop">SHOP NOW</button></p></div>')+'</div>'}
function checkout(){if(!count())return cart();return '<div class="page"><div class="eyebrow">SECURE CHECKOUT PREVIEW</div><h1>Checkout</h1><div class="callout">Demo checkout. No real payment, shipping request, or order will be submitted.</div><form class="form" id="checkoutForm"><label>Full name<input name="name" maxlength="70" required placeholder="Your full name"></label><label>Mobile number<input name="mobile" type="tel" maxlength="10" pattern="[0-9]{10}" required placeholder="10-digit mobile number"></label><label>Receive order<select name="method"><option>Store Pickup — Kharghar</option><option>Delivery Enquiry</option></select></label><label>Demo payment method<select><option>Pay at store — demo only</option></select></label><div class="total"><span>Total</span><span>'+money(sum())+'</span></div><button class="primary" type="submit">CREATE DEMO ORDER</button></form></div>'}
function track(){return '<div class="page"><div class="eyebrow">YOUR ORDERS</div><h1>Track Order</h1><p style="color:#817366;font-size:13px">Enter the demo order ID shown after checkout.</p><form class="form" id="trackForm"><label>Order ID<input name="id" required placeholder="GP-DEMO-1234"></label><button class="primary">TRACK DEMO ORDER</button></form><div id="trackResult"></div></div>'}
function admin(){return '<div class="page"><div class="eyebrow">GALAXY POINT</div><h1>Admin Dashboard Preview</h1><div class="callout">Public demo only. No real admin access or cloud inventory is exposed here.</div><div class="categories" style="grid-template-columns:repeat(2,1fr)"><div class="category" style="min-height:120px"><h2>'+items.length+'</h2>Demo Products</div><div class="category" style="min-height:120px"><h2>'+orders.length+'</h2>Demo Orders</div></div><h2 style="font:26px Georgia;margin-top:40px">Inventory Preview</h2>'+items.map(p=>'<div class="line"><div><strong>'+p.name+'</strong><small>'+money(p.price)+' • Stock '+p.stock+'</small></div><div class="quantity"><button data-stock="-'+p.id+'">−</button><button data-stock="+'+p.id+'">+</button></div></div>').join("")+'<h2 style="font:26px Georgia;margin-top:40px">Test Orders</h2>'+(orders.length?orders.map(o=>'<div class="line"><div><strong>'+o.id+'</strong><small>'+money(o.total)+' • '+o.name+'</small></div><span class="badgelike">Pending</span></div>').join(""):'<p>No demo orders yet.</p>')+'</div>'}
function count(){return Object.values(bag).reduce((a,b)=>a+b,0)}function sum(){return items.reduce((t,p)=>t+p.price*(bag[p.id]||0),0)}
function show(){document.getElementById("bagCount").textContent=count();v.innerHTML=(page==="home"?home():page==="shop"?shop():page==="cart"?cart():page==="checkout"?checkout():page==="track"?track():admin())+footer();document.getElementById("menuPop").classList.remove("visible");window.scrollTo({top:0,behavior:"instant"})}
document.addEventListener("click",function(e){const t=e.target.closest("[data-page],[data-cat],[data-add],[data-dec],[data-like],[data-stock]");if(!t)return;const d=t.dataset;if(d.page){page=d.page;show()}else if(d.cat){cat=d.cat;page="shop";show()}else if(d.add){const p=items.find(x=>x.id===+d.add);if(p&&(bag[p.id]||0)<p.stock){bag[p.id]=(bag[p.id]||0)+1;show()}}else if(d.dec){bag[d.dec]=(bag[d.dec]||0)-1;if(bag[d.dec]<=0)delete bag[d.dec];show()}else if(d.like){t.textContent=t.textContent==="♥"?"♡":"♥";t.style.color="#b94f52"}else if(d.stock){let p=items.find(x=>x.id===+d.stock.slice(1));if(p){p.stock=Math.max(0,p.stock+(d.stock[0]==="+"?1:-1));show()}}});
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("menuPop").classList.toggle("visible"));
document.getElementById("chatBtn").addEventListener("click",()=>alert("Galaxy Point Kharghar — Visit Shop No. 49, Tiara Mall, Sector 13. This is a demo; WhatsApp is not configured yet."));
document.addEventListener("submit",function(e){if(e.target.id==="checkoutForm"){e.preventDefault();const f=new FormData(e.target);const id="GP-DEMO-"+Math.floor(1000+Math.random()*9000);orders.push({id,name:String(f.get("name")).slice(0,70),total:sum()});bag={};page="track";show();document.getElementById("trackResult").innerHTML='<div class="callout"><strong>Demo order created:</strong> '+id+'<br>No real order was submitted. Enter the ID above to try order tracking.</div>'}else if(e.target.id==="trackForm"){e.preventDefault();const f=new FormData(e.target),id=String(f.get("id")).trim().toUpperCase(),o=orders.find(x=>x.id===id);document.getElementById("trackResult").innerHTML=o?'<div class="callout"><strong>'+o.id+'</strong><br>Status: Demo Pending<br>Amount: '+money(o.total)+'</div>':'<div class="callout">No matching demo order in this browser session.</div>'}});
show();
})();
</script></body></html>
